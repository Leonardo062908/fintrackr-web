<section class="dashboard">
  <app-ft-page-header
    title="FinTrackr"
    subtitle="Organize seus gastos, metas e investimentos em único lugar!"
  >
  </app-ft-page-header>

  <div class="dashboard-grid">
    <app-ft-card title="Resumo do mês">
      <ng-container *ngIf="monthlySummary$ | async as summary">
        <div class="summary-item">
          <span class="summary-label">Receitas: </span>
          <span class="summary-value income">{{
            summary.totalIncome | currency: "BRL"
          }}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Despesas: </span>
          <span class="summary-value expense">{{
            summary.totalExpenses | currency: "BRL"
          }}</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Saldo: </span>
          <span
            class="summary-value"
            [class.positive]="summary.balance >= 0"
            [class.negative]="summary.balance < 0"
          >
            {{ summary.balance | currency: "BRL" }}
          </span>
        </div>
      </ng-container>
      <!-- Você pode adicionar um *else para mostrar "Carregando..." se quiser -->
    </app-ft-card>

    <app-ft-card title="Próximos passos">
      <ul *ngIf="nextActions$ | async as actions">
        <li *ngFor="let action of actions">{{ action }}</li>
      </ul>
    </app-ft-card>
  </div>
</section>
