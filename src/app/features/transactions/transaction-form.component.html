<section class="transaction-form-page">
  <app-ft-page-header [title]="pageTitle" subtitle="Preencha os campos abaixo.">
  </app-ft-page-header>

  <form class="transaction-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span class="field-label">Tipo</span>
      <select formControlName="type" class="field-control">
        <option [value]="transactionType.Income">Receita</option>
        <option [value]="transactionType.Expense">Despesa</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">Valor (R$)</span>
      <input
        type="number"
        step="0.01"
        min="0.01"
        formControlName="amount"
        class="field-control"
      />
      @if (
        form.controls.amount.touched &&
        form.controls.amount.errors?.["required"]
      ) {
        <span class="field-error">Informe o valor.</span>
      }
      @if (
        form.controls.amount.touched && form.controls.amount.errors?.["min"]
      ) {
        <span class="field-error">O valor deve ser pelo menos 0,01.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Descrição</span>
      <input type="text" formControlName="description" class="field-control" />
      @if (
        form.controls.description.touched &&
        form.controls.description.errors?.["required"]
      ) {
        <span class="field-error">Informe a descrição.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Data</span>
      <input
        type="date"
        formControlName="transactionDate"
        class="field-control"
      />
      @if (
        form.controls.transactionDate.touched &&
        form.controls.transactionDate.errors?.["required"]
      ) {
        <span class="field-error">Informe a data.</span>
      }
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a routerLink="/transactions" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</section>
